<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1b16">
  <title>Xadrez contra o Brambila</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="bot-bar">
      <div class="avatar-wrap">
        <img id="botAvatar" alt="Avatar do bot" class="avatar">
        <span id="botAvatarFallback" class="avatar-fallback" hidden>🐶</span>
      </div>
      <div class="bot-info">
        <h1 id="botName">Brambila</h1>
        <p id="botElo">ELO 1200</p>
      </div>
      <div id="thinking" class="thinking" hidden>
        <span></span><span></span><span></span>
      </div>
    </header>

    <main class="layout">
      <section class="board-area">
        <div id="board" class="board" role="grid" aria-label="Tabuleiro de xadrez"></div>
        <div class="player-bar">
          <span id="playerLabel">Você</span>
          <span id="statusText" class="status">Carregando o motor de xadrez…</span>
        </div>
      </section>

      <aside class="side">
        <div class="controls">
          <button id="btnNew" class="btn primary">Nova partida</button>
          <button id="btnUndo" class="btn">Desfazer</button>
          <button id="btnResign" class="btn danger">Desistir</button>
        </div>
        <div class="moves-card">
          <h2>Lances</h2>
          <ol id="moves" class="moves"></ol>
        </div>
      </aside>
    </main>

    <footer class="foot">
      Motor: Stockfish.js · Regras: chess.js
    </footer>
  </div>

  <!-- Janela: nova partida -->
  <div id="setupModal" class="modal" hidden>
    <div class="modal-box">
      <h2>Nova partida</h2>
      <p class="muted">Desafie o <strong class="bot-name-inline">Brambila</strong>!</p>

      <fieldset class="field">
        <legend>Sua cor</legend>
        <div class="seg" id="colorChoice">
          <label><input type="radio" name="color" value="w" checked><span>♔ Brancas</span></label>
          <label><input type="radio" name="color" value="b"><span>♚ Pretas</span></label>
          <label><input type="radio" name="color" value="r"><span>🎲 Sorteio</span></label>
        </div>
      </fieldset>

      <div class="field">
        <label for="eloRange">Nível do Brambila: <strong id="eloValue">1200</strong> ELO</label>
        <input type="range" id="eloRange" min="800" max="2800" step="100" value="1200">
        <div class="range-legend"><span>800</span><span>1800</span><span>2800</span></div>
        <p id="eloLabel" class="muted"></p>
      </div>

      <button id="btnStart" class="btn primary big" disabled>Carregando motor…</button>
    </div>
  </div>

  <!-- Janela: promoção -->
  <div id="promoModal" class="modal" hidden>
    <div class="modal-box small">
      <h2>Promover peão para:</h2>
      <div id="promoChoices" class="promo"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
